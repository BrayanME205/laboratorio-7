<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpresoFast - Sign in</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
    <main class="login-card">
        <h1>ExpresoFast</h1>
        <p>Sign in to manage shipments</p>

        <div id="login-error" class="alert alert-error hidden" role="alert"></div>

        <form id="login-form" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button id="login-button" class="btn btn-block" type="submit">Sign in</button>
        </form>
    </main>

    <script>
        const API_BASE_URL = 'http://localhost:8080';

        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('login-error');
        const button = document.getElementById('login-button');

        if (localStorage.getItem('jwt_token')) {
            window.location.replace('index.html');
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove('hidden');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.classList.add('hidden');

            const username = form.username.value.trim();
            const password = form.password.value;
            if (!username || !password) {
                showError('Username and password are required');
                return;
            }

            button.disabled = true;
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    showError(response.status === 401
                        ? 'Invalid username or password'
                        : 'Unable to sign in. Please try again');
                    return;
                }

                const data = await response.json();
                localStorage.setItem('jwt_token', data.token);
                localStorage.setItem('username', data.username);
                localStorage.setItem('roles', JSON.stringify(data.roles));
                localStorage.setItem('token_expiration', String(data.expirationTime));
                window.location.replace('index.html');
            } catch (error) {
                showError('Cannot reach the server. Make sure the backend is running');
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
