<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpresoFast - Iniciar sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-body" data-page="login">
    <main class="login-card">
        <header>
            <h1>ExpresoFast</h1>
            <p>Inicie sesión para gestionar los envíos</p>
        </header>

        <div id="loginError" class="alert alert-error" role="status" aria-live="polite"></div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button id="loginButton" class="btn btn-block" type="submit">Ingresar</button>
        </form>

        <footer class="login-footer">
            <small>&copy; 2026 ExpresoFast - UCR Sede del Atlántico</small>
        </footer>
    </main>

    <script src="app.js"></script>
</body>

</html>
